<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>初回案内 アプリをダウンロード</title>
<style>
  body{background:#0a0a0a;color:#ddd;font-family:sans-serif;text-align:center;padding:18vh 24px 0;line-height:1.8}
  a{color:#d4af37;font-weight:700;font-size:18px}
  .sub{color:#777;font-size:13px;margin-top:16px}
</style>
</head>
<body>
<div id="msg">最新のアプリ（APK）を取得しています…</div>
<div class="sub">自動で始まらないときは <a id="fallback" href="https://github.com/wpuhs2216-hub/host-menu-app/releases/latest">こちら</a> から .apk を選んでください</div>
<script>
// QR コードの行き先を固定するための転送ページ。
// 版が上がっても QR を作り直さなくて済むよう、その時点の最新リリースの .apk へ飛ばす
(async () => {
  try {
    const r = await fetch('https://api.github.com/repos/wpuhs2216-hub/host-menu-app/releases/latest', { headers: { Accept: 'application/vnd.github+json' } });
    const j = await r.json();
    const apk = (j.assets || []).find((a) => /\.apk$/i.test(a.name));
    if (!apk) throw new Error('apk なし');
    document.getElementById('msg').innerHTML = `${j.tag_name} をダウンロードします<br><a href="${apk.browser_download_url}">始まらないときはここをタップ</a>`;
    document.getElementById('fallback').href = apk.browser_download_url;
    location.href = apk.browser_download_url;
  } catch (e) {
    document.getElementById('msg').textContent = '最新版の取得に失敗しました。下のリンクから開いてください。';
  }
})();
</script>
</body>
</html>
