<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ファイナルカレンダー</title>
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" href="./admin-icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Noto+Serif+JP:wght@900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="/src/finale.css" />
</head>
<body class="fc-body">
  <header class="fc-bar">
    <a href="./admin.html" class="fc-back">← 管理画面</a>
    <div class="fc-month">
      <button type="button" class="fc-nav" id="fc-prev" aria-label="前の月">‹</button>
      <span id="fc-month-label">—</span>
      <button type="button" class="fc-nav" id="fc-next" aria-label="次の月">›</button>
    </div>
    <button type="button" class="fc-save" id="fc-save">画像で保存</button>
  </header>

  <main class="fc-main">
    <p class="fc-note" id="fc-note"></p>
    <div class="fc-poster" id="fc-poster">
      <img class="fc-bg" id="fc-bg" alt="" />
      <div class="fc-hero" id="fc-hero"></div>
      <img class="fc-bg fc-frame" id="fc-frame" alt="" hidden />
      <div id="fc-slots"></div>
    </div>

    <section class="fc-panel" id="fc-hero-panel">
      <h2>大きく出す人（前月いちばんファイナルが多かった人）</h2>
      <p id="fc-hero-desc" class="fc-desc"></p>
      <div class="fc-actions">
        <button type="button" id="fc-hero-pick">人を手で選ぶ</button>
        <button type="button" id="fc-hero-auto">自動に戻す</button>
        <label class="fc-file">背景を消した写真を載せる（この人の分として覚えます）<input type="file" id="fc-hero-file" accept="image/png,image/webp" hidden /></label>
        <button type="button" id="fc-hero-file-clear">載せた写真を外す</button>
      </div>
    </section>

    <section class="fc-panel" id="fc-season" hidden>
      <h2>季節の背景</h2>
      <p id="fc-season-desc" class="fc-desc"></p>
      <div class="fc-actions">
        <label class="fc-file">この月から使う背景を載せる<input type="file" id="fc-season-file" accept="image/png,image/jpeg,image/webp" hidden /></label>
        <button type="button" id="fc-season-clear">この月から載せた背景を外す</button>
      </div>
      <h2 class="fc-sub">枠の日数</h2>
      <p class="fc-desc">その月の営業日の数に合わせて、カレンダーのマスの数を変えられます。</p>
      <div class="fc-actions">
        <label id="fc-day-count-row" class="fc-inline" hidden>この月の日数
          <select id="fc-day-count" class="fc-select">
            <option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option>
          </select>
        </label>
      </div>
      <div id="fc-labels" hidden>
        <h2 class="fc-sub">DAY の文字</h2>
        <p class="fc-desc">日を選んで好きな文字を入れると、その日の「DAY◯」が金色の文字に変わります（例: 感謝デー・社長BD）。空にして「入れる」を押すと DAY に戻ります。この月だけに効きます。</p>
        <div class="fc-actions">
          <select id="fc-label-day" class="fc-select"></select>
          <input type="text" id="fc-label-text" class="fc-input" maxlength="12" placeholder="感謝デー" />
          <button type="button" id="fc-label-save">入れる</button>
        </div>
        <p id="fc-label-list" class="fc-desc fc-label-list"></p>
      </div>
    </section>

    <section class="fc-panel">
      <h2>表示</h2>
      <label class="fc-toggle"><input type="checkbox" id="fc-show-names" checked /> 枠に名前を出す（オフにすると、画面と「画像で保存」の両方から名前が消えます。どの月にも効きます）</label>
    </section>

    <section class="fc-panel">
      <h2>枠の写真の位置（顔）</h2>
      <p class="fc-desc">四角い枠に、写真のどこを映すかを人ごとに決められます。メニューの写真の見え方は変わりません。</p>
      <div class="fc-actions"><button type="button" id="fc-face-list-open">位置を直す人を選ぶ</button></div>
      <div class="fc-face-list" id="fc-face-list" hidden></div>
    </section>
  </main>

  <script type="module" src="/src/finale.js"></script>
</body>
</html>
