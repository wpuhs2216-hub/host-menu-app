<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>初回案内</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-192.svg" />
  <link rel="apple-touch-icon" href="./icon-192.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="header">
    <h1 id="header-logo" class="header-logo-img"><img src="./logo.png" alt="GENTLY DIVA" /></h1>
    <button class="seat-btn" id="seat-btn" type="button">席：未選択</button>
    <div class="color-picker" id="color-picker">
      <div class="color-btn-wrap">
        <button class="color-btn color-yellow active" data-color="yellow" aria-label="Yellow" title="Yellow"><span class="color-count" data-color-count="yellow">0</span></button>
        <span class="color-btn-label"></span>
      </div>
      <div class="color-btn-wrap">
        <button class="color-btn color-red" data-color="red" aria-label="Red" title="Red"><span class="color-count" data-color-count="red">0</span></button>
        <span class="color-btn-label"></span>
      </div>
      <div class="color-btn-wrap">
        <button class="color-btn color-blue" data-color="blue" aria-label="Blue" title="Blue"><span class="color-count" data-color-count="blue">0</span></button>
        <span class="color-btn-label"></span>
      </div>
      <div class="color-btn-wrap">
        <button class="color-btn color-green" data-color="green" aria-label="Green" title="Green"><span class="color-count" data-color-count="green">0</span></button>
        <span class="color-btn-label"></span>
      </div>
      <button class="reset-btn" id="reset-btn" type="button">リセット</button>
    </div>
    <div class="header-clock" id="header-clock"></div>
  </header>

  <!-- 最初のメニュー選択画面（設定「最初にメニュー選択画面を出す」がオンの時だけ表示） -->
  <div class="home-screen" id="home-screen" style="display:none">
    <div class="home-inner">
      <button class="home-btn home-btn-consent" id="home-consent" type="button" style="display:none">
        <span class="hb-title">ご新規様同意書</span>
        <span class="hb-sub">タップして署名画面を開く</span>
      </button>
      <button class="home-btn" id="home-price" type="button">
        <span class="hb-title">料金システム</span>
      </button>
      <button class="home-btn" id="home-cast" type="button">
        <span class="hb-title">ALLCAST</span>
      </button>
      <button class="home-btn" id="home-officer" type="button" style="display:none">
        <span class="hb-title">役職メニュー</span>
      </button>
    </div>
  </div>

  <!-- メニュー選択画面へ戻る（選択画面を使っている時だけ表示） -->
  <button class="menu-back" id="menu-back" type="button" style="display:none">← メニューに戻る</button>

  <!-- 同意書ボタン（設定でオンにした時だけ表示。パネルの上に横長で置く） -->
  <button class="consent-entry" id="consent-entry" type="button" style="display:none">
    <span class="ce-title">ご新規様同意書</span>
    <span class="ce-sub">タップして署名画面を開く</span>
  </button>

  <main class="grid-container" id="grid"></main>

  <!-- 確定ボタン（チェック時のみ表示） -->
  <button class="confirm-btn" id="confirm-btn" style="display:none">
    確定<span class="confirm-badge" id="confirm-count">0</span>
  </button>

  <!-- 全画面プレビュー（スワイプ対応） -->
  <div class="fullscreen-overlay" id="fullscreen">
    <button class="fs-close" id="fs-close">✕</button>
    <div class="fs-swipe-area" id="fs-swipe-area">
      <img id="fs-image" src="" alt="" />
      <div class="fs-placeholder" id="fs-placeholder" style="display:none">♠</div>
    </div>
    <div class="fs-thumbs" id="fs-thumbs" style="display:none"></div>
    <div class="fs-info">
      <div class="fs-new-badge" id="fs-new-badge" style="display:none">NEW</div>
      <div class="fs-title" id="fs-title"></div>
      <div class="fs-name" id="fs-name"></div>
    </div>
    <!-- 全画面用チェックボックス＋確定ボタン -->
    <div class="fs-action-area" id="fs-action-area">
      <label class="fs-checkbox" id="fs-checkbox" style="display:none">
        <input type="checkbox" id="fs-check-input" />
        <span class="fs-cb-mark"></span>
      </label>
      <button class="fs-confirm-btn" id="fs-confirm-btn" style="display:none">
        確定<span class="confirm-badge" id="fs-confirm-count">0</span>
      </button>
    </div>
    <div class="fs-nav">
      <div class="fs-counter" id="fs-counter"></div>
    </div>
  </div>

  <!-- 確定モーダル -->
  <div class="modal-overlay" id="order-modal">
    <div class="modal modal-orders">
      <h3>確定</h3>
      <div id="order-cast-list" class="order-cast-list"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="order-cancel">キャンセル</button>
        <button class="btn btn-primary" id="order-submit">送信</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
